services:
  - type: web
    name: telegram-bot-sateq
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @workspace/telegram-bot run start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
    plan: free
