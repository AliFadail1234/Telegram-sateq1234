<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم البوت</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #263248; --border: #334155;
    --accent: #6366f1; --accent2: #818cf8; --green: #22c55e; --red: #ef4444;
    --yellow: #f59e0b; --text: #e2e8f0; --muted: #94a3b8; --input: #1e293b;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; min-height: 100vh; }

  /* ===== شاشة تسجيل الدخول ===== */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--bg);
  }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 20px; width: 360px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  .login-box .icon { font-size: 48px; margin-bottom: 12px; }
  .login-box h1 { font-size: 22px; margin-bottom: 6px; }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .login-box input {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 10px;
    text-align: center; letter-spacing: 2px;
  }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600;
    transition: background .2s;
  }
  .btn-primary[disabled] { opacity: 0.6; cursor: default; }
  .btn-primary:hover { background: var(--accent2); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; white-space: pre-wrap; }

  /* ===== تخطيط اللوحة ===== */
  #app { display: none; }
  .topbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .nav {
    background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; padding: 0 24px; gap: 4px; overflow-x: auto;
  }
  .nav-btn {
    padding: 12px 20px; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent;
    white-space: nowrap; transition: all .2s;
  }
  .nav-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }
  .nav-btn:hover { color: var(--text); }

  .content { padding: 24px; max-width: 1100px; margin: 0 auto; }

  /* ===== حالة فارغة / تحميل ===== */
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .loading { text-align: center; padding: 30px; color: var(--muted); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid var(--border); color: var(--text);
    padding: 12px 24px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 999;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="login-screen">
  <div class="login-box">
    <div class="icon">🤖</div>
    <h1>لوحة تحكم البوت</h1>
    <p>أدخل كلمة المرور للدخول</p>
    <!-- allow overriding API base for debugging -->
    <input type="text" id="server-input" placeholder="API server (اختياري)" style="font-size:12px;padding:8px;margin-bottom:8px;" />
    <input type="password" id="password-input" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-primary" id="login-btn" onclick="login()">دخول →</button>
    <p class="login-error" id="login-error">كلمة المرور غير صحيحة</p>
    <p style="color:var(--muted);font-size:12px;margin-top:8px;">ملاحظة: كلمة المرور على الخادم يجب أن تطابق متغير البيئة ADMIN_PASSWORD.</p>
  </div>
</div>

<!-- اللوحة الرئيسية -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🤖 لوحة تحكم بوت تيليجرام</div>
    <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="showTab('stats', this)">📊 الإحصائيات</button>
    <button class="nav-btn" onclick="showTab('channels', this)">📢 القنوات</button>
    <button class="nav-btn" onclick="showTab('campaigns', this)">🎯 الحملات</button>
    <button class="nav-btn" onclick="showTab('users', this)">👥 المستخدمون</button>
   <button class="nav-btn" onclick="showTab('pricing', this)">⚙️ التسعير</button>
  </div>
  <div class="content">

    <!-- ===== إحصائيات ===== -->
    <div id="tab-stats">
      <div class="stats-grid" id="stats-grid">
        <div class="loading">⏳ جاري التحميل...</div>
      </div>
    </div>

    <!-- بقية الواجهة كما كانت (مختصرة) -->
    <div id="tab-channels" style="display:none"><div id="channels-body"><div class="loading">⏳</div></div></div>
    <div id="tab-campaigns" style="display:none"><div id="campaigns-active-body"><div class="loading">⏳</div></div></div>
    <div id="tab-users" style="display:none"><div id="users-body"><div class="loading">⏳</div></div></div>
    <div id="tab-pricing" style="display:none"><div id="pricing-body"><div class="loading">⏳</div></div></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Allow overriding BASE for debugging (user can type another host in the login box)
let BASE = window.location.origin;
let TOKEN = '';
let usersData = [];

function showToast(msg, ttl = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ttl);
}

async function readJsonSafe(resp) {
  try { return await resp.json(); } catch { return null; }
}

function setLoginError(text) {
  const el = document.getElementById('login-error');
  el.textContent = text;
  el.style.display = 'block';
}

function clearLoginError() {
  const el = document.getElementById('login-error');
  el.style.display = 'none';
}

// Try auto-login if token saved in localStorage
window.addEventListener('DOMContentLoaded', async () => {
  // set server-input default
  const serverInput = document.getElementById('server-input');
  if (serverInput) serverInput.value = BASE;

  try {
    const saved = localStorage.getItem('admin_token');
    if (!saved) return;
    TOKEN = saved;
    const loginBox = document.querySelector('.login-box');
    if (loginBox) loginBox.style.opacity = '0.6';

    const r = await apiFetch('/admin/api/stats');
    if (r.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadStats();
      showToast('تم تسجيل الدخول تلقائياً');
    } else {
      const body = await readJsonSafe(r);
      const msg = body && body.error ? body.error : `Status ${r.status}`;
      // invalid token -> remove and stay on login screen
      localStorage.removeItem('admin_token');
      TOKEN = '';
      setLoginError(`خطأ: ${msg}`);
    }
  } catch (err) {
    console.error('Admin auto-login failed:', err);
    showToast('خطأ في الاتصال. تفقد سجلات الخادم أو الشبكة.');
  } finally {
    const loginBox = document.querySelector('.login-box');
    if (loginBox) loginBox.style.opacity = '1';
  }
});

// ===== تسجيل الدخول =====
async function login() {
  const pwdEl = document.getElementById('password-input');
  const serverEl = document.getElementById('server-input');
  if (serverEl && serverEl.value) BASE = serverEl.value.replace(/\/+$/, '');
  const pwd = pwdEl.value;
  if (!pwd) return;
  TOKEN = pwd;
  clearLoginError();
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  try {
    const r = await apiFetch('/admin/api/stats');
    if (r.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      localStorage.setItem('admin_token', TOKEN);
      loadStats();
      showToast('تم تسجيل الدخول');
    } else {
      const body = await readJsonSafe(r);
      const msg = body && body.error ? body.error : `Status ${r.status}`;
      setLoginError(`خطأ: ${msg}`);
      TOKEN = '';
    }
  } catch (err) {
    console.error('Login request failed:', err);
    setLoginError('فشل الاتصال بالخادم. تحقّق من عنوان الخادم أو الشبكة.');
    TOKEN = '';
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  TOKEN = '';
  localStorage.removeItem('admin_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('password-input').value = '';
  clearLoginError();
}

// ===== API helper =====
async function apiFetch(path, opts = {}) {
  const url = (BASE || window.location.origin) + path;
  return fetch(url, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
}

// ===== تبويبات =====
function showTab(name, btn) {
  ['stats', 'channels', 'campaigns', 'users', 'pricing'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (el) el.style.display = t === name ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (name === 'stats') loadStats();
}

// ===== إحصائيات =====
async function loadStats() {
  try {
    const r = await apiFetch('/admin/api/stats');
    if (!r.ok) { showToast('خطأ عند تحميل الإحصاءات'); return; }
    const d = await r.json();
    const g = document.getElementById('stats-grid');
    if (g) g.innerHTML = `\n      <div class="stat-card"><div class="icon">👥</div><div class="value">${d.users}</div><div class="label">مستخدم مسجّل</div></div>\n      <div class="stat-card"><div class="icon">📢</div><div class="value">${d.channels}</div><div class="label">قناة نشطة</div></div>\n      <div class="stat-card"><div class="icon">🎯</div><div class="value">${d.campaigns}</div><div class="label">حملة نشطة</div></div>\n      <div class="stat-card"><div class="icon">✅</div><div class="value">${d.tasks}</div><div class="label">مهمة مكتملة</div></div>\n      <div class="stat-card"><div class="icon">💰</div><div class="value">${d.totalPoints}</div><div class="label">نقاط إجمالية</div></div>\n    `;
  } catch (err) {
    console.error('loadStats error', err);
    showToast('فشل تحميل الإحصاءات');
  }
}

</script>
</body>
</html>
