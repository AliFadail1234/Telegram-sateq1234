<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم البوت</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #263248; --border: #334155;
    --accent: #6366f1; --accent2: #818cf8; --green: #22c55e; --red: #ef4444;
    --yellow: #f59e0b; --text: #e2e8f0; --muted: #94a3b8; --input: #1e293b;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; min-height: 100vh; }

  /* ===== شاشة تسجيل الدخول ===== */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--bg);
  }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 32px; width: 360px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  .login-box .icon { font-size: 48px; margin-bottom: 12px; }
  .login-box h1 { font-size: 22px; margin-bottom: 6px; }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 12px;
    text-align: center; letter-spacing: 2px;
  }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600;
    transition: background .2s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* ===== تخطيط اللوحة ===== */
  #app { display: none; }
  .topbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .nav {
    background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; padding: 0 24px; gap: 4px; overflow-x: auto;
  }
  .nav-btn {
    padding: 12px 20px; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent;
    white-space: nowrap; transition: all .2s;
  }
  .nav-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }
  .nav-btn:hover { color: var(--text); }

  .content { padding: 24px; max-width: 1100px; margin: 0 auto; }

  /* ===== بطاقات الإحصاء ===== */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; text-align: center;
  }
  .stat-card .icon { font-size: 28px; margin-bottom: 8px; }
  .stat-card .value { font-size: 32px; font-weight: 800; color: var(--accent2); }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ===== جداول ===== */
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .section-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-header h3 { font-size: 15px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--card2); padding: 10px 16px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 500; }
  td { padding: 11px 16px; border-top: 1px solid var(--border); font-size: 14px; }
  tr:hover td { background: var(--card2); }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
  .badge-red { background: rgba(239,68,68,.15); color: var(--red); }

  /* ===== أزرار ===== */
  .btn {
    padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all .15s;
  }
  .btn-green { background: rgba(34,197,94,.15); color: var(--green); }
  .btn-green:hover { background: rgba(34,197,94,.3); }
  .btn-red { background: rgba(239,68,68,.15); color: var(--red); }
  .btn-red:hover { background: rgba(239,68,68,.3); }
  .btn-blue { background: rgba(99,102,241,.2); color: var(--accent2); }
  .btn-blue:hover { background: rgba(99,102,241,.35); }
  .btn-add {
    background: var(--accent); color: #fff; padding: 8px 18px;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
    font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .btn-add:hover { background: var(--accent2); }

  /* ===== نموذج إضافة قناة ===== */
  .add-form {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px; display: none;
  }
  .add-form.show { display: block; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr 120px auto; gap: 10px; align-items: end; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-size: 14px;
  }
  .form-group input:focus { outline: none; border-color: var(--accent); }

  /* ===== إعدادات التسعير ===== */
  .pricing-form { padding: 20px; }
  .pricing-intro { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
  .pricing-main-field { max-width: 360px; margin-bottom: 24px; }
  .pricing-main-field input, .pricing-row input {
    width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-size: 14px;
  }
  .pricing-main-field input:focus, .pricing-row input:focus { outline: none; border-color: var(--accent); }
  .pricing-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .pricing-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .save-pricing-btn {
    background: var(--accent); color: #fff; padding: 9px 20px; border: none;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .save-pricing-btn:hover { background: var(--accent2); }
  .pricing-status { color: var(--muted); font-size: 13px; }

  /* ===== بحث ===== */
  .search-bar {
    padding: 9px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; width: 220px;
  }
  .search-bar:focus { outline: none; border-color: var(--accent); }

  /* ===== حالة فارغة / تحميل ===== */
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .loading { text-align: center; padding: 30px; color: var(--muted); }

  /* ===== تنبيه ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid var(--border); color: var(--text);
    padding: 12px 24px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 999;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== جداول قابلة للتمرير ===== */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 500px; }

  /* ===== موبايل ===== */
  @media (max-width: 700px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .content { padding: 12px; }

    /* شريط العنوان */
    .topbar { padding: 10px 14px; gap: 8px; }
    .topbar-title { font-size: 14px; }
    .logout-btn { padding: 5px 10px; font-size: 12px; white-space: nowrap; }

    /* شريط التنقل */
    .nav { padding: 0 8px; }
    .nav-btn { padding: 10px 12px; font-size: 13px; }

    /* نموذج الإضافة */
    .form-row { grid-template-columns: 1fr; }
    .add-form { padding: 14px; }

    /* بحث */
    .search-bar { width: 100%; }
    .section-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .section-header h3 { font-size: 14px; }
     .pricing-form { padding: 14px; }
     .pricing-table { min-width: 0; }

    /* صندوق تسجيل الدخول */
    .login-box { width: calc(100% - 32px); padding: 28px 20px; }

    /* الأزرار داخل الجدول */
    .btn { padding: 5px 10px; font-size: 12px; }
    .btn-add { padding: 7px 12px; font-size: 13px; }
  }

  @media (max-width: 400px) {
    .stats-grid { grid-template-columns: 1fr; }
    .topbar-title { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="login-screen">
  <div class="login-box">
    <div class="icon">🤖</div>
    <h1>لوحة تحكم البوت</h1>
    <p>أدخل كلمة المرور للدخول</p>
    <input type="password" id="password-input" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-primary" onclick="login()">دخول →</button>
    <p class="login-error" id="login-error">كلمة المرور غير صحيحة</p>
  </div>
</div>

<!-- اللوحة الرئيسية -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🤖 لوحة تحكم بوت تيليجرام</div>
    <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="showTab('stats', this)">📊 الإحصائيات</button>
    <button class="nav-btn" onclick="showTab('channels', this)">📢 القنوات</button>
    <button class="nav-btn" onclick="showTab('campaigns', this)">🎯 الحملات</button>
    <button class="nav-btn" onclick="showTab('users', this)">👥 المستخدمون</button>
   <button class="nav-btn" onclick="showTab('pricing', this)">⚙️ التسعير</button>
  </div>
  <div class="content">

    <!-- ===== إحصائيات ===== -->
    <div id="tab-stats">
      <div class="stats-grid" id="stats-grid">
        <div class="loading">⏳ جاري التحميل...</div>
      </div>
    </div>

    <!-- ===== القنوات ===== -->
    <div id="tab-channels" style="display:none">
      <div id="add-channel-form" class="add-form">
        <div class="form-row">
          <div class="form-group">
            <label>معرّف القناة أو رابطها</label>
            <input type="text" id="new-ch-username" placeholder="@channelname أو t.me/channelname">
          </div>
          <div class="form-group">
            <label>النقاط</label>
            <input type="number" id="new-ch-points" placeholder="10" min="1">
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <button class="btn-add" onclick="addChannel()">✅ إضافة</button>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h3>القنوات النشطة</h3>
          <button class="btn-add" onclick="toggleForm('add-channel-form')">➕ قناة جديدة</button>
        </div>
        <div id="channels-body"><div class="loading">⏳</div></div>
      </div>
    </div>

    <!-- ===== الحملات ===== -->
    <div id="tab-campaigns" style="display:none">
      <div class="section">
        <div class="section-header"><h3>🟢 الحملات النشطة</h3></div>
        <div id="campaigns-active-body"><div class="loading">⏳</div></div>
      </div>
      <div class="section">
        <div class="section-header"><h3>✅ الحملات المكتملة</h3></div>
        <div id="campaigns-completed-body"><div class="loading">⏳</div></div>
      </div>
    </div>

    <!-- ===== المستخدمون ===== -->
    <div id="tab-users" style="display:none">
      <div class="section">
        <div class="section-header">
          <h3>المستخدمون</h3>
          <input type="text" class="search-bar" placeholder="🔍 بحث بالاسم..." oninput="filterUsers(this.value)">
        </div>
        <div id="users-body"><div class="loading">⏳</div></div>
      </div>
    </div>

    <!-- ===== التسعير ===== -->
    <div id="tab-pricing" style="display:none">
      <div class="section">
        <div class="section-header"><h3>إعدادات التسعير</h3></div>
        <div id="pricing-body">
          <div class="loading">⏳ جاري التحميل...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = window.location.origin;
let TOKEN = '';
let usersData = [];

// Try auto-login if token saved in localStorage
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const saved = localStorage.getItem('admin_token');
    if (!saved) return;
    TOKEN = saved;
    const loginBox = document.querySelector('.login-box');
    if (loginBox) loginBox.style.opacity = '0.6';

    const r = await apiFetch('/admin/api/stats');
    if (r.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      // don't overwrite localStorage; it's already the saved token
      loadStats();
    } else {
      // invalid token -> remove and stay on login screen
      localStorage.removeItem('admin_token');
      TOKEN = '';
      const errEl = document.getElementById('login-error');
      if (errEl) errEl.style.display = 'none';
    }
  } catch (err) {
    // Network or other error — log for debugging but don't clear token automatically
    console.error('Admin auto-login failed:', err);
  } finally {
    const loginBox = document.querySelector('.login-box');
    if (loginBox) loginBox.style.opacity = '1';
  }
});

// ===== تسجيل الدخول =====
async function login() {
  const pwd = document.getElementById('password-input').value;
  if (!pwd) return;
  TOKEN = pwd;
  try {
    const r = await apiFetch('/admin/api/stats');
    if (r.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      localStorage.setItem('admin_token', TOKEN);
      loadStats();
    } else {
      document.getElementById('login-error').style.display = 'block';
      TOKEN = '';
    }
  } catch {
    document.getElementById('login-error').style.display = 'block';
    TOKEN = '';
  }
}

function logout() {
  TOKEN = '';
  localStorage.removeItem('admin_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('password-input').value = '';
  document.getElementById('login-error').style.display = 'none';
}

// ===== API helper =====
async function apiFetch(path, opts = {}) {
  return fetch(BASE + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
}

// ===== تبويبات =====
function showTab(name, btn) {
  ['stats', 'channels', 'campaigns', 'users', 'pricing'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (name === 'stats') loadStats();
  if (name === 'channels') loadChannels();
  if (name === 'campaigns') loadCampaigns();
  if (name === 'users') loadUsers();
  if (name === 'pricing') loadPricing();
}

function toggleForm(id) {
  const el = document.getElementById(id);
  el.classList.toggle('show');
}

// ===== إحصائيات =====
async function loadStats() {
  const r = await apiFetch('/admin/api/stats');
  const d = await r.json();
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="icon">👥</div><div class="value">${d.users}</div><div class="label">مستخدم مسجّل</div></div>
    <div class="stat-card"><div class="icon">📢</div><div class="value">${d.channels}</div><div class="label">قناة نشطة</div></div>
    <div class="stat-card"><div class="icon">🎯</div><div class="value">${d.campaigns}</div><div class="label">حملة نشطة</div></div>
    <div class="stat-card"><div class="icon">✅</div><div class="value">${d.tasks}</div><div class="label">مهمة مكتملة</div></div>
    <div class="stat-card"><div class="icon">💰</div><div class="value">${d.totalPoints}</div><div class="label">نقاط إجمالية</div></div>
  `;
}

// ===== القنوات =====
async function loadChannels() {
  const r = await apiFetch('/admin/api/channels');
  const channels = await r.json();
  const el = document.getElementById('channels-body');
  if (!channels.length) { el.innerHTML = '<div class="empty">لا توجد قنوات بعد</div>'; return; }
  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>#</th><th>المعرّف</th><th>الاسم</th><th>النقاط</th><th>إجراءات</th></tr>
    ${channels.map(c => `<tr>
      <td>${c.id}</td>
      <td>@${c.channel_username}</td>
      <td>${c.channel_name}</td>
      <td><span id="pts-${c.id}">${c.points_reward}</span></td>
      <td>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <input type="number" id="edit-pts-`,
